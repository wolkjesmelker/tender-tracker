appId: com.questric.tender-tracker
productName: TenderTracker
copyright: "Copyright © 2026 Questric. Alle rechten voorbehouden. Onbevoegde verspreiding of kopiëren is verboden."

directories:
  output: release
  buildResources: resources

files:
  - dist-electron
  - dist
  - package.json
  - "node_modules/**"
  - "!node_modules/.cache"
  - "!node_modules/.package-lock.json"

asar: false
npmRebuild: false
afterPack: scripts/after-pack.js

# ── Auto-update ──────────────────────────────────────────────────────────────
# Publiceren naar GitHub Releases: push een versie-tag (v*.*.*) om de
# GitHub Actions workflow te triggeren. Die bouwt en publiceert automatisch.
# Lokaal: npm run release:patch | release:minor | release:major
publish:
  provider: github
  owner: wolkjesmelker
  repo: tender-tracker

# ── macOS ────────────────────────────────────────────────────────────────────
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: resources/icon.icns
  category: public.app-category.business
  artifactName: "TenderTracker-${version}-mac-${arch}.${ext}"
  darkModeSupport: true
  # Zonder code-signing: gebruikers moeten bij eerste start
  # rechtermuisknop → Openen kiezen (macOS Gatekeeper).
  # Met Apple Developer-certificaat: stel CSC_LINK en CSC_KEY_PASSWORD in.
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  # Geen spatie in schijfnaam: hdiutil create faalt anders (EPERM op /Volumes/…/TenderTracker.app).
  title: "${productName}-v${version}"
  background: resources/dmg-background.png
  icon: resources/icon.icns
  iconSize: 80
  artifactName: "TenderTracker-${version}-mac-${arch}.dmg"
  window:
    width: 540
    height: 380
  contents:
    - x: 130
      y: 190
      type: file
    - x: 410
      y: 190
      type: link
      path: /Applications

# ── Windows ──────────────────────────────────────────────────────────────────
win:
  target:
    - nsis
  icon: resources/icon.ico
  artifactName: "TenderTracker-${version}-win-${arch}.${ext}"
  publisherName: Questric
  legalTrademarks: "TenderTracker is een handelsmerk van Questric"

nsis:
  # Data staat buiten de installatiemap (o.a. %APPDATA%/tender-tracker); nooit automatisch wissen
  # bij deïnstallatie of na een update — gebruikers behouden DB en bijlagen.
  deleteAppDataOnUninstall: false
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerHeader: resources/installer-header.bmp
  installerSidebar: resources/installer-sidebar.bmp
  artifactName: "TenderTracker-${version}-Setup.exe"
  shortcutName: TenderTracker
  createDesktopShortcut: true
  createStartMenuShortcut: true
  menuCategory: Questric
  displayLanguageSelector: false
  language: "1043"
  include: resources/installer.nsh

# ── Linux ────────────────────────────────────────────────────────────────────
linux:
  target:
    - AppImage
    - deb
  icon: resources/icon.png
  category: Office
  artifactName: "TenderTracker-${version}-linux-${arch}.${ext}"
  desktop:
    Name: TenderTracker
    Comment: Aanbestedingen monitoring platform — door Questric voor Van de Kreeke Groep
    Categories: Office;ProjectManagement
